name: Garage
options:
  bundleIdPrefix: com.writes
  deploymentTarget:
    iOS: "17.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.0.0
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm
    from: 5.0.0
  TPPDF:
    url: https://github.com/techprimate/TPPDF
    from: 2.5.0
  SwiftLintPlugins:
    url: https://github.com/SimplyDanny/SwiftLintPlugins
    from: 0.57.0
settings:
  base:
    PRODUCT_NAME: Garage
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ALWAYS_SEARCH_USER_PATHS: NO
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Configuration/Debug.xcconfig
  Release: Configuration/Release.xcconfig
targets:
  Garage:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    scheme:
      testTargets:
        - GarageUnitTests
        - GarageUITests
      gatherCoverageData: false
    info:
      path: Garage/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: Attach receipts and vehicle photos.
        NSPhotoLibraryUsageDescription: Select receipts and vehicle photos.
        NSPhotoLibraryAddUsageDescription: Save generated reports to your photo library.
        NSMicrophoneUsageDescription: Speak a log entry and Garage drafts it for you to review.
        NSSpeechRecognitionUsageDescription: Turns your spoken log entry into text you confirm before saving.
        CFBundleDisplayName: Garage
        # XcodeGen writes a hardcoded CFBundleVersion of "1" when it is not declared here — it
        # does NOT derive it from CURRENT_PROJECT_VERSION. Without these two lines the build
        # number is frozen at 1 forever and every upload after the first is rejected by App
        # Store Connect with ENTITY_ERROR.ATTRIBUTE.INVALID.DUPLICATE ("bundle version must be
        # higher than the previously uploaded version"). Pointing the plist at the build
        # settings makes bumping CURRENT_PROJECT_VERSION actually take effect.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # App uses only standard/exempt encryption (HTTPS/TLS); declaring this avoids the
        # "Missing Compliance" hold on every TestFlight/App Store upload.
        ITSAppUsesNonExemptEncryption: false
        # Crashlytics is consent-gated (audit #23): collection stays OFF until AppState
        # enables it alongside Analytics after a profile load confirms the stored opt-in.
        FirebaseCrashlyticsCollectionEnabled: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.writes.harrysplayhouse
        # Without this the AppIcon.appiconset is never compiled: Assets.car ships with zero
        # appicon entries, Info.plist gets no CFBundleIconName, and App Store Connect rejects
        # the upload. Verified 2026-07-24 against a real signed archive that had a valid
        # 1024x1024 icon asset on disk and no icon in the product.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 3
        MARKETING_VERSION: 1.0
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: GarageDebug.entitlements
          PRODUCT_BUNDLE_IDENTIFIER: com.writes.harrysplayhouse.debug
          ONLY_ACTIVE_ARCH: YES
          ENABLE_TESTABILITY: YES
        Release:
          CODE_SIGN_ENTITLEMENTS: Garage.entitlements
          PRODUCT_BUNDLE_IDENTIFIER: com.writes.harrysplayhouse
          # Distribution signing (operator-approved 2026-07-24; rationale + the three failed
          # alternatives in docs/research/2026-07-24_SIGNING_CONFIG_PROPOSAL.md). These MUST be
          # target-scoped: passing them as xcodebuild command-line overrides applies them to
          # every SPM package target too, and ~25 of them fail "does not support provisioning
          # profiles". verify-ios.sh stays unsigned and green because its own command-line
          # overrides (CODE_SIGNING_ALLOWED=NO ...) take precedence over these.
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: V32WV64X82
          # NOT "Apple Distribution": cert SUR3K7JZ7F is type IOS_DISTRIBUTION, whose common
          # name is "iPhone Distribution: ...". xcodebuild matches on a CN prefix.
          CODE_SIGN_IDENTITY: iPhone Distribution
          PROVISIONING_PROFILE_SPECIFIER: Garage App Store
          SWIFT_COMPILATION_MODE: wholemodule
          COPY_PHASE_STRIP: YES
          DEAD_CODE_STRIPPING: YES
          VALIDATE_PRODUCT: YES
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseCore
      - package: RevenueCat
        product: RevenueCat
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: TPPDF
        product: TPPDF
    sources:
      - path: Garage
        excludes:
          - Resources/GoogleService-Info.plist
      - path: Configuration/Secrets.swift
    resources:
      - Garage/Resources
    postBuildScripts:
      - name: Bundle Local Firebase Config
        shell: /bin/sh
        script: |
          GOOGLE_SERVICE_INFO_PATH="${SRCROOT}/Garage/Resources/GoogleService-Info.plist"
          BUNDLED_CONFIG_PATH="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist"
          APP_INFO_PLIST_PATH="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"

          if [ -f "${GOOGLE_SERVICE_INFO_PATH}" ]; then
            cp "${GOOGLE_SERVICE_INFO_PATH}" "${BUNDLED_CONFIG_PATH}"

            FIREBASE_GOOGLE_APP_ID=$(/usr/libexec/PlistBuddy -c "Print :GOOGLE_APP_ID" "${GOOGLE_SERVICE_INFO_PATH}" 2>/dev/null || true)
            GOOGLE_CLIENT_ID=$(/usr/libexec/PlistBuddy -c "Print :CLIENT_ID" "${GOOGLE_SERVICE_INFO_PATH}" 2>/dev/null || true)
            GOOGLE_REVERSED_CLIENT_ID=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" "${GOOGLE_SERVICE_INFO_PATH}" 2>/dev/null || true)

            if [ -n "${FIREBASE_GOOGLE_APP_ID}" ]; then
              FIREBASE_AUTH_CALLBACK_SCHEME="app-${FIREBASE_GOOGLE_APP_ID//:/-}"
            fi

            /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "${APP_INFO_PLIST_PATH}" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "${APP_INFO_PLIST_PATH}"

            URL_TYPE_INDEX=0
            add_url_scheme() {
              URL_SCHEME="$1"

              if [ -n "${URL_SCHEME}" ]; then
                /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:${URL_TYPE_INDEX} dict" "${APP_INFO_PLIST_PATH}"
                /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:${URL_TYPE_INDEX}:CFBundleURLSchemes array" "${APP_INFO_PLIST_PATH}"
                /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:${URL_TYPE_INDEX}:CFBundleURLSchemes:0 string ${URL_SCHEME}" "${APP_INFO_PLIST_PATH}"
                URL_TYPE_INDEX=$((URL_TYPE_INDEX + 1))
              fi
            }

            add_url_scheme "${FIREBASE_AUTH_CALLBACK_SCHEME}"
            add_url_scheme "${GOOGLE_REVERSED_CLIENT_ID}"

            if [ "${URL_TYPE_INDEX}" -eq 0 ]; then
              /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "${APP_INFO_PLIST_PATH}" 2>/dev/null || true
            fi

            if [ -n "${GOOGLE_CLIENT_ID}" ]; then
              /usr/libexec/PlistBuddy -c "Delete :GIDClientID" "${APP_INFO_PLIST_PATH}" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :GIDClientID string ${GOOGLE_CLIENT_ID}" "${APP_INFO_PLIST_PATH}"
            fi
          fi
        inputFiles:
          - $(SRCROOT)/Garage/Resources/GoogleService-Info.plist
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
        basedOnDependencyAnalysis: false
        showEnvVars: false
      # Crashlytics dSYM upload (audit #14): without this phase Release crashes arrive
      # unsymbolicated. Release-only (CI Debug/test builds skip it), fail-soft (a network
      # failure warns instead of failing the build), and no-ops when the SPM checkout or
      # GoogleService-Info.plist is absent.
      - name: Upload dSYMs to Crashlytics
        shell: /bin/sh
        script: |
          if [ "${CONFIGURATION}" != "Release" ]; then
            echo "Skipping Crashlytics dSYM upload for ${CONFIGURATION}."
            exit 0
          fi
          GOOGLE_SERVICE_INFO_PATH="${SRCROOT}/Garage/Resources/GoogleService-Info.plist"
          UPLOAD_TOOL="${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/upload-symbols"
          if [ ! -f "${GOOGLE_SERVICE_INFO_PATH}" ] || [ ! -x "${UPLOAD_TOOL}" ]; then
            echo "warning: Crashlytics upload-symbols or GoogleService-Info.plist missing; skipping dSYM upload."
            exit 0
          fi
          # Bounded watchdog (landmine #14: every spawn site carries a timeout) — the upload
          # tool hangs indefinitely without network/auth, which stalled the CI archive.
          "${UPLOAD_TOOL}" -gsp "${GOOGLE_SERVICE_INFO_PATH}" -p ios "${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}" &
          UPLOAD_PID=$!
          WAITED=0
          while kill -0 "${UPLOAD_PID}" 2>/dev/null && [ "${WAITED}" -lt 90 ]; do
            sleep 5
            WAITED=$((WAITED + 5))
          done
          if kill -0 "${UPLOAD_PID}" 2>/dev/null; then
            kill "${UPLOAD_PID}" 2>/dev/null
            echo "warning: Crashlytics dSYM upload timed out after ${WAITED}s; symbolicate manually with upload-symbols."
          fi
          wait "${UPLOAD_PID}" 2>/dev/null \
            || echo "warning: Crashlytics dSYM upload did not complete; symbolicate manually with upload-symbols."
        inputFiles:
          - $(DWARF_DSYM_FOLDER_PATH)/$(DWARF_DSYM_FILE_NAME)
        basedOnDependencyAnalysis: false
        showEnvVars: false
  GarageUnitTests:
    type: bundle.unit-test
    platform: iOS
    productName: GarageUnitTests
    deploymentTarget: "17.0"
    info:
      path: Tests/UnitTests/Info.plist
    settings:
      base:
        PRODUCT_MODULE_NAME: GarageUnitTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Garage.app/Garage"
        BUNDLE_LOADER: "$(TEST_HOST)"
        ONLY_ACTIVE_ARCH: YES
    sources:
      - Tests/UnitTests
    dependencies:
      - target: Garage
      - package: Firebase
        product: FirebaseAuth
        link: false
      - package: Firebase
        product: FirebaseFirestore
        link: false
      - package: Firebase
        product: FirebaseFunctions
        link: false
      - package: Firebase
        product: FirebaseStorage
        link: false
      - package: Firebase
        product: FirebaseAnalytics
        link: false
      - package: Firebase
        product: FirebaseAppCheck
        link: false
      - package: Firebase
        product: FirebaseCrashlytics
        link: false
      - package: Firebase
        product: FirebaseMessaging
        link: false
      - package: Firebase
        product: FirebaseCore
        link: false
      - package: RevenueCat
        product: RevenueCat
        link: false
      - package: GoogleSignIn
        product: GoogleSignIn
        link: false
      - package: TPPDF
        product: TPPDF
        link: false
  GarageUITests:
    type: bundle.ui-testing
    platform: iOS
    productName: GarageUITests
    deploymentTarget: "17.0"
    info:
      path: Tests/UITests/Info.plist
    settings:
      base:
        PRODUCT_MODULE_NAME: GarageUITests
    sources:
      - Tests/UITests
    dependencies:
      - target: Garage
