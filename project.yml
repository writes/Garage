name: Garage
options:
  bundleIdPrefix: com.writes
  deploymentTarget:
    iOS: "17.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.0.0
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm
    from: 5.0.0
  TPPDF:
    url: https://github.com/techprimate/TPPDF
    from: 2.5.0
  SwiftLintPlugins:
    url: https://github.com/SimplyDanny/SwiftLintPlugins
    from: 0.57.0
settings:
  base:
    PRODUCT_NAME: Garage
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ALWAYS_SEARCH_USER_PATHS: NO
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Configuration/Debug.xcconfig
  Release: Configuration/Release.xcconfig
targets:
  Garage:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    scheme:
      testTargets:
        - GarageUnitTests
        - GarageUITests
      gatherCoverageData: false
    info:
      path: Garage/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: Attach receipts and vehicle photos.
        NSPhotoLibraryUsageDescription: Select receipts and vehicle photos.
        NSPhotoLibraryAddUsageDescription: Save generated reports to your photo library.
        NSMicrophoneUsageDescription: Speak a log entry and Garage drafts it for you to review.
        NSSpeechRecognitionUsageDescription: Turns your spoken log entry into text you confirm before saving.
        CFBundleDisplayName: Garage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.writes.harrysplayhouse
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: GarageDebug.entitlements
          PRODUCT_BUNDLE_IDENTIFIER: com.writes.harrysplayhouse.debug
          ONLY_ACTIVE_ARCH: YES
          ENABLE_TESTABILITY: YES
        Release:
          CODE_SIGN_ENTITLEMENTS: Garage.entitlements
          PRODUCT_BUNDLE_IDENTIFIER: com.writes.harrysplayhouse
          SWIFT_COMPILATION_MODE: wholemodule
          COPY_PHASE_STRIP: YES
          DEAD_CODE_STRIPPING: YES
          VALIDATE_PRODUCT: YES
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseCore
      - package: RevenueCat
        product: RevenueCat
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: TPPDF
        product: TPPDF
    sources:
      - path: Garage
        excludes:
          - Resources/GoogleService-Info.plist
      - path: Configuration/Secrets.swift
    resources:
      - Garage/Resources
    postBuildScripts:
      - name: Bundle Local Firebase Config
        shell: /bin/sh
        script: |
          GOOGLE_SERVICE_INFO_PATH="${SRCROOT}/Garage/Resources/GoogleService-Info.plist"
          BUNDLED_CONFIG_PATH="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist"
          APP_INFO_PLIST_PATH="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"

          if [ -f "${GOOGLE_SERVICE_INFO_PATH}" ]; then
            cp "${GOOGLE_SERVICE_INFO_PATH}" "${BUNDLED_CONFIG_PATH}"

            FIREBASE_GOOGLE_APP_ID=$(/usr/libexec/PlistBuddy -c "Print :GOOGLE_APP_ID" "${GOOGLE_SERVICE_INFO_PATH}" 2>/dev/null || true)
            GOOGLE_CLIENT_ID=$(/usr/libexec/PlistBuddy -c "Print :CLIENT_ID" "${GOOGLE_SERVICE_INFO_PATH}" 2>/dev/null || true)
            GOOGLE_REVERSED_CLIENT_ID=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" "${GOOGLE_SERVICE_INFO_PATH}" 2>/dev/null || true)

            if [ -n "${FIREBASE_GOOGLE_APP_ID}" ]; then
              FIREBASE_AUTH_CALLBACK_SCHEME="app-${FIREBASE_GOOGLE_APP_ID//:/-}"
            fi

            /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "${APP_INFO_PLIST_PATH}" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "${APP_INFO_PLIST_PATH}"

            URL_TYPE_INDEX=0
            add_url_scheme() {
              URL_SCHEME="$1"

              if [ -n "${URL_SCHEME}" ]; then
                /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:${URL_TYPE_INDEX} dict" "${APP_INFO_PLIST_PATH}"
                /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:${URL_TYPE_INDEX}:CFBundleURLSchemes array" "${APP_INFO_PLIST_PATH}"
                /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:${URL_TYPE_INDEX}:CFBundleURLSchemes:0 string ${URL_SCHEME}" "${APP_INFO_PLIST_PATH}"
                URL_TYPE_INDEX=$((URL_TYPE_INDEX + 1))
              fi
            }

            add_url_scheme "${FIREBASE_AUTH_CALLBACK_SCHEME}"
            add_url_scheme "${GOOGLE_REVERSED_CLIENT_ID}"

            if [ "${URL_TYPE_INDEX}" -eq 0 ]; then
              /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "${APP_INFO_PLIST_PATH}" 2>/dev/null || true
            fi

            if [ -n "${GOOGLE_CLIENT_ID}" ]; then
              /usr/libexec/PlistBuddy -c "Delete :GIDClientID" "${APP_INFO_PLIST_PATH}" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :GIDClientID string ${GOOGLE_CLIENT_ID}" "${APP_INFO_PLIST_PATH}"
            fi
          fi
        inputFiles:
          - $(SRCROOT)/Garage/Resources/GoogleService-Info.plist
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
        basedOnDependencyAnalysis: false
        showEnvVars: false
  GarageUnitTests:
    type: bundle.unit-test
    platform: iOS
    productName: GarageUnitTests
    deploymentTarget: "17.0"
    info:
      path: Tests/UnitTests/Info.plist
    settings:
      base:
        PRODUCT_MODULE_NAME: GarageUnitTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Garage.app/Garage"
        BUNDLE_LOADER: "$(TEST_HOST)"
        ONLY_ACTIVE_ARCH: YES
    sources:
      - Tests/UnitTests
    dependencies:
      - target: Garage
      - package: Firebase
        product: FirebaseAuth
        link: false
      - package: Firebase
        product: FirebaseFirestore
        link: false
      - package: Firebase
        product: FirebaseFunctions
        link: false
      - package: Firebase
        product: FirebaseStorage
        link: false
      - package: Firebase
        product: FirebaseAnalytics
        link: false
      - package: Firebase
        product: FirebaseAppCheck
        link: false
      - package: Firebase
        product: FirebaseCrashlytics
        link: false
      - package: Firebase
        product: FirebaseMessaging
        link: false
      - package: Firebase
        product: FirebaseCore
        link: false
      - package: RevenueCat
        product: RevenueCat
        link: false
      - package: GoogleSignIn
        product: GoogleSignIn
        link: false
      - package: TPPDF
        product: TPPDF
        link: false
  GarageUITests:
    type: bundle.ui-testing
    platform: iOS
    productName: GarageUITests
    deploymentTarget: "17.0"
    info:
      path: Tests/UITests/Info.plist
    settings:
      base:
        PRODUCT_MODULE_NAME: GarageUITests
    sources:
      - Tests/UITests
    dependencies:
      - target: Garage
