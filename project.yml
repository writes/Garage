name: Garage
options:
  bundleIdPrefix: com.yourcompany
  deploymentTarget:
    iOS: "17.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.0.0
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm
    from: 5.0.0
  TPPDF:
    url: https://github.com/techprimate/TPPDF
    from: 2.5.0
  SwiftLintPlugins:
    url: https://github.com/SimplyDanny/SwiftLintPlugins
    from: 0.57.0
settings:
  base:
    PRODUCT_NAME: Garage
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ALWAYS_SEARCH_USER_PATHS: NO
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Configuration/Debug.xcconfig
  Release: Configuration/Release.xcconfig
targets:
  Garage:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    info:
      path: Garage/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: Attach receipts and vehicle photos.
        NSPhotoLibraryUsageDescription: Select receipts and vehicle photos.
        NSPhotoLibraryAddUsageDescription: Save generated reports to your photo library.
        CFBundleDisplayName: Garage
    entitlements:
      path: Garage.entitlements
      properties:
        aps-environment: development
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.garage
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          COPY_PHASE_STRIP: YES
          DEAD_CODE_STRIPPING: YES
          VALIDATE_PRODUCT: YES
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseCore
      - package: RevenueCat
        product: RevenueCat
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: TPPDF
        product: TPPDF
    sources:
      - path: Garage
        excludes:
          - Resources/GoogleService-Info.plist
      - path: Configuration/Secrets.swift
    resources:
      - Garage/Resources
  GarageUnitTests:
    type: bundle.unit-test
    platform: iOS
    productName: GarageUnitTests
    deploymentTarget: "17.0"
    info:
      path: Tests/UnitTests/Info.plist
    settings:
      base:
        PRODUCT_MODULE_NAME: GarageUnitTests
    sources:
      - Tests/UnitTests
    dependencies:
      - target: Garage
  GarageUITests:
    type: bundle.ui-testing
    platform: iOS
    productName: GarageUITests
    deploymentTarget: "17.0"
    info:
      path: Tests/UITests/Info.plist
    settings:
      base:
        PRODUCT_MODULE_NAME: GarageUITests
    sources:
      - Tests/UITests
    dependencies:
      - target: Garage
