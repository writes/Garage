name: CI

# The PR gate is the only gate. There is deliberately NO `push: main` trigger: every change
# reaches main through a PR whose gate compiled main+PR together, so re-running the same
# 31-minute macOS gate on the merge result re-proves what the PR gate proved minutes earlier.
# Measured 2026-07-29: 94.5 of that day's 249 macOS minutes (38%) went to those re-runs, before
# the 10x macOS billing multiplier.
#
# KNOWN GAP, accepted deliberately: main has no required status checks, so nothing *prevents*
# merging a red or still-running PR — and without this trigger, such a merge would not be caught
# until the next PR's gate compiles main. Close it by making `ios` and `functions` required
# status checks with the strict (branches-up-to-date) policy, which also makes the PR gate
# formally equivalent to a main gate. Until then this trades a small detection delay for 38% of
# the CI bill. If you ever want that guarantee back without the ruleset change, restore:
#   push:
#     branches: [main]
on:
  pull_request:

# One run per ref: a new push supersedes the previous run instead of both burning a full
# macOS gate to completion. This plus the 75-minute job cap are the two structural answers to
# the 2026-07-28 billing spike (~3,400 billed minutes in a day once CI started actually
# compiling: back-to-back pushes ran overlapping 30-minute gates, and one deadlocked test held
# a runner for 2h14m).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the 31-minute macOS gate is worth starting, on a runner that costs ~10 seconds
  # of ubuntu time. This has to be a separate JOB rather than trigger-level `paths-ignore`: a
  # workflow filtered out at the trigger never reports its checks at all, so a REQUIRED check stays
  # Pending and the PR is unmergeable forever. A job skipped by `if:` reports as skipped, which
  # does satisfy a required check.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          set -euo pipefail
          BASE="origin/${{ github.base_ref }}"
          # grep -q -v -E succeeds when ANY line does not match the docs pattern, i.e. when at
          # least one real file changed. A PR touching only docs exits 1 and skips the gate.
          if git diff --name-only "$BASE"...HEAD \
              | grep -qvE '(^(docs|reports|results|logs)/|^\.github/ISSUE_TEMPLATE/|\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Docs-only change; skipping the macOS gate."
          fi

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CloudFunctions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CloudFunctions/package-lock.json
      - run: npm ci
      - run: npm run build

  ios:
    runs-on: macos-15
    # A single deadlocked test once held a runner for 2h14m (GitHub's default cap is 6h).
    # Known-good full gate is ~53 min; anything past this is a hang, not a slow run.
    timeout-minutes: 75
    needs: changes
    # Replaces the old `[skip ios]` hatch, which tested github.event.head_commit.message — that
    # is populated only on push events, so with the push:main trigger removed it could never fire
    # again. The `changes` job is the PR-event equivalent.
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      # The runner's DEFAULT Xcode diverges from the local toolchain in both directions
      # (it rejected main's `isolated deinit` as experimental while also being stricter about
      # implicit self). Select the newest installed Xcode so CI tracks the toolchain the code
      # is actually developed against; the version is echoed for the log.
      - name: Select newest installed Xcode
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      # The real GoogleService-Info.plist is a local secret and never reaches CI. Without ANY
      # plist the test host boots unconfigured and every Firestore-touching unit test dies with
      # FIRIllegalStateException (observed: 7 runner crash-restarts, 260 tests silently lost).
      # A syntactically valid dummy lets FirebaseApp.configure() succeed; hermetic tests never
      # reach the network, and UI tests run in demo mode. CI-ONLY — never bundled in releases.
      - name: Write dummy Firebase config for hermetic tests
        run: |
          set -euo pipefail
          PLIST="Garage/Resources/GoogleService-Info.plist"
          if [ ! -f "$PLIST" ]; then
            cat > "$PLIST" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>GOOGLE_APP_ID</key><string>1:000000000000:ios:0000000000000000</string>
            <key>API_KEY</key><string>AIzaSyA-ci-dummy-never-a-real-key-00000</string>
            <key>GCM_SENDER_ID</key><string>000000000000</string>
            <key>PROJECT_ID</key><string>ci-dummy-project</string>
            <key>STORAGE_BUCKET</key><string>ci-dummy-project.appspot.com</string>
            <key>BUNDLE_ID</key><string>com.writes.harrysplayhouse</string>
            <key>CLIENT_ID</key><string>000000000000-ci0dummy.apps.googleusercontent.com</string>
            <key>REVERSED_CLIENT_ID</key><string>com.googleusercontent.apps.000000000000-ci0dummy</string>
            <key>IS_ADS_ENABLED</key><false/>
            <key>IS_ANALYTICS_ENABLED</key><false/>
            <key>IS_APPINVITE_ENABLED</key><false/>
            <key>IS_GCM_ENABLED</key><true/>
            <key>IS_SIGNIN_ENABLED</key><true/>
            <key>PLIST_VERSION</key><string>1</string>
          </dict>
          </plist>
          EOF
            echo "wrote CI dummy $PLIST"
          fi
      # Pinned, not `brew install` (unpinned = nondeterministic: brew always resolves latest).
      # Versions match the repo-local .tools/bin toolchain: xcodegen 2.45.3, swiftlint 0.63.2.
      - name: Install pinned xcodegen + swiftlint
        run: |
          set -euo pipefail
          mkdir -p .tools/bin
          curl -fsSL -o /tmp/xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/2.45.3/xcodegen.zip"
          unzip -q -o /tmp/xcodegen.zip -d /tmp/xcodegen-extract
          cp /tmp/xcodegen-extract/xcodegen/bin/xcodegen .tools/bin/xcodegen
          curl -fsSL -o /tmp/swiftlint.zip "https://github.com/realm/SwiftLint/releases/download/0.63.2/portable_swiftlint.zip"
          unzip -q -o /tmp/swiftlint.zip -d /tmp/swiftlint-extract
          cp /tmp/swiftlint-extract/swiftlint .tools/bin/swiftlint
          chmod +x .tools/bin/xcodegen .tools/bin/swiftlint
          .tools/bin/xcodegen --version
          .tools/bin/swiftlint version
          echo "$(pwd)/.tools/bin" >> "$GITHUB_PATH"
      - run: ./scripts/ci/verify-ios.sh
