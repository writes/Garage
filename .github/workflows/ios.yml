name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CloudFunctions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CloudFunctions/package-lock.json
      - run: npm ci
      - run: npm run build

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # The runner's DEFAULT Xcode diverges from the local toolchain in both directions
      # (it rejected main's `isolated deinit` as experimental while also being stricter about
      # implicit self). Select the newest installed Xcode so CI tracks the toolchain the code
      # is actually developed against; the version is echoed for the log.
      - name: Select newest installed Xcode
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      # The real GoogleService-Info.plist is a local secret and never reaches CI. Without ANY
      # plist the test host boots unconfigured and every Firestore-touching unit test dies with
      # FIRIllegalStateException (observed: 7 runner crash-restarts, 260 tests silently lost).
      # A syntactically valid dummy lets FirebaseApp.configure() succeed; hermetic tests never
      # reach the network, and UI tests run in demo mode. CI-ONLY — never bundled in releases.
      - name: Write dummy Firebase config for hermetic tests
        run: |
          set -euo pipefail
          PLIST="Garage/Resources/GoogleService-Info.plist"
          if [ ! -f "$PLIST" ]; then
            cat > "$PLIST" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>GOOGLE_APP_ID</key><string>1:000000000000:ios:0000000000000000</string>
            <key>API_KEY</key><string>AIzaSyA-ci-dummy-never-a-real-key-00000</string>
            <key>GCM_SENDER_ID</key><string>000000000000</string>
            <key>PROJECT_ID</key><string>ci-dummy-project</string>
            <key>STORAGE_BUCKET</key><string>ci-dummy-project.appspot.com</string>
            <key>BUNDLE_ID</key><string>com.writes.harrysplayhouse</string>
            <key>CLIENT_ID</key><string>000000000000-ci0dummy.apps.googleusercontent.com</string>
            <key>REVERSED_CLIENT_ID</key><string>com.googleusercontent.apps.000000000000-ci0dummy</string>
            <key>IS_ADS_ENABLED</key><false/>
            <key>IS_ANALYTICS_ENABLED</key><false/>
            <key>IS_APPINVITE_ENABLED</key><false/>
            <key>IS_GCM_ENABLED</key><true/>
            <key>IS_SIGNIN_ENABLED</key><true/>
            <key>PLIST_VERSION</key><string>1</string>
          </dict>
          </plist>
          EOF
            echo "wrote CI dummy $PLIST"
          fi
      # Pinned, not `brew install` (unpinned = nondeterministic: brew always resolves latest).
      # Versions match the repo-local .tools/bin toolchain: xcodegen 2.45.3, swiftlint 0.63.2.
      - name: Install pinned xcodegen + swiftlint
        run: |
          set -euo pipefail
          mkdir -p .tools/bin
          curl -fsSL -o /tmp/xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/2.45.3/xcodegen.zip"
          unzip -q -o /tmp/xcodegen.zip -d /tmp/xcodegen-extract
          cp /tmp/xcodegen-extract/xcodegen/bin/xcodegen .tools/bin/xcodegen
          curl -fsSL -o /tmp/swiftlint.zip "https://github.com/realm/SwiftLint/releases/download/0.63.2/portable_swiftlint.zip"
          unzip -q -o /tmp/swiftlint.zip -d /tmp/swiftlint-extract
          cp /tmp/swiftlint-extract/swiftlint .tools/bin/swiftlint
          chmod +x .tools/bin/xcodegen .tools/bin/swiftlint
          .tools/bin/xcodegen --version
          .tools/bin/swiftlint version
          echo "$(pwd)/.tools/bin" >> "$GITHUB_PATH"
      - run: ./scripts/ci/verify-ios.sh
