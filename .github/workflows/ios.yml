name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CloudFunctions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CloudFunctions/package-lock.json
      - run: npm ci
      - run: npm run build

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen swiftlint
      - run: ./scripts/ci/verify-ios.sh
